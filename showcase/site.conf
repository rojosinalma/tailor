# The showcase as a static site.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location / {
        try_files $uri $uri/index.html =404;
    }

    # The app manifest has a type of its own. It and the service worker file are asked for again on every visit.
    location ~ /manifest\.webmanifest$ {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~ /sw\.js$ {
        add_header Cache-Control "no-cache";
    }
}
