name: release
run-name: ${{ github.ref_name }} · release artifact

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bin/build --release
      - name: Attach the artifact to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" dist/release/*.tgz dist/release/*.sha256 --clobber
